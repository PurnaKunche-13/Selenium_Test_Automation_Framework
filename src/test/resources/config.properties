# Override with -Dkey=value or AUTOMATION_UPPER_SNAKE_CASE environment variables.
# Precedence: JVM property > environment variable > selected profile > defaults.
env=local
browser=chrome
baseUrl=https://www.saucedemo.com/
headless=true
explicitWait=15
pageLoadTimeout=45
apiBaseUrl=https://jsonplaceholder.typicode.com
apiConnectTimeoutMs=10000
apiReadTimeoutMs=20000
# Optional broad smoke budget, not a performance benchmark; 0 disables it.
apiMaxResponseTimeMs=0

# Maximum extra attempts after the first failure. Set to 0 for strict first-attempt checks.
maxRetries=1
